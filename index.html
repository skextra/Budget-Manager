<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="Images/Logo.png" type="image/x-icon">
    <meta property="og:image" content="https://github.com/skextra/Budget-Manager/blob/main/Images/Open%20Graph%20Card.png?raw=true" />
    <link rel="stylesheet" href="style.css">
    <title>Budget Manager</title>
</head>

<body class="">
    <nav
        class="h-[80px] my-[10px] bg-[#161614] border-2 border-[#2E2C29] rounded-[20px]  flex justify-between items-center p-[10px]">
        <img src="Images/fulllogo.png" alt="" class="h-[50px]">
        <a href="https://skextra.github.io/Portfolio/" target="_blank"
            class="h-[60px] md:w-[120px] w-[80px] border-2 center bg-[#1E1D1B] border-[#2E2C29] rounded-[15px] hover:bg-[#272522] hover:scale-[110%] duration-200 ease-in">Web
            ➚</a>
    </nav>
    <section id="overview" class="mt-8">

        <h2 class="mb-6 text-center md:text-start">OVERVIEW </h2>

        <div class="cards flex flex-wrap gap-8 justify-center md:justify-start">
            <div
                class="card bg-[#0D2E1A]  w-[250px] h-[90px] flex flex-col justify-between p-3 rounded-[15px] border-[2px] border-[#1A4D2A]">
                <h4 class="text-[#22C55E]">Total income</h4>
                <h1 class="text-[30px] text-[#22C55E] ">Rs. 134,200,000</h1>
            </div>
            <div
                class="card bg-[#2d0e0e]  w-[250px] h-[90px] flex flex-col justify-between p-3 rounded-[15px] border-[2px] border-[#4D1A1A]">
                <h4 class="text-[#f87171]">Expenses</h4>
                <h1 class="text-[30px] text-[#f87171] ">Rs. 1,200,000</h1>
            </div>
            <div
                class="card bg-[#0d1e3d]  w-[250px] h-[90px] flex flex-col justify-between p-3 rounded-[15px] border-[2px] border-[#1A3466]">
                <h4 class="text-[#3B82F6]">Balance</h4>
                <h1 class="text-[30px] text-[#3B82F6] ">Rs. 200,000</h1>
            </div>
            <div
                class="card bg-[#2d2008]  w-[250px] h-[90px] flex flex-col justify-between p-3 rounded-[15px] border-[2px] border-[#4D380E]">
                <h4 class="text-[#FBBF24]">Savings</h4>
                <h1 class="text-[30px] text-[#FBBF24] ">Rs. 134,200,000</h1>
            </div>
        </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="script.js"></script>
</body>

</html>
